name: Update nowwhy.kr data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nowwhy-collector
  # If GitHub leaves a runner stuck in "Starting job", the next trigger replaces it
  # instead of blocking every later refresh behind the stale run.
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify scheduler safety (no API calls)
        run: python -m unittest discover -s tests -p test_scheduler.py
      - name: Restore rolling collector state
        uses: actions/cache/restore@v4
        with:
          path: collector/data
          key: nowwhy-data-${{ github.run_id }}
          restore-keys: nowwhy-data-
      - name: Collect signals, analyze changed topics, and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          SITE_UPLOAD_URL: https://nowwhy.kr
          SITE_UPLOAD_TOKEN: ${{ secrets.SITE_UPLOAD_TOKEN }}
          SUDDENLYWHY_DATA_DIR: ${{ github.workspace }}/collector/data
          SUDDENLYWHY_FORCE_ANALYSIS_SECONDS: 10800
          SUDDENLYWHY_MIN_ANALYSIS_SECONDS: 3600
          SUDDENLYWHY_ECO_FORCE_ANALYSIS_SECONDS: 43200
          SUDDENLYWHY_ECO_MIN_ANALYSIS_SECONDS: 14400
          SUDDENLYWHY_MONTHLY_BUDGET_USD: 5.50
          SUDDENLYWHY_BUDGET_RUN_RESERVE_USD: 0.20
          SUDDENLYWHY_BUDGET_COST_MULTIPLIER: 1.20
          SUDDENLYWHY_BUDGET_SEED_MONTH: 2026-09
          SUDDENLYWHY_BUDGET_SEED_SPEND_USD: 3.27
        run: python collector/cloud_runner.py
      - name: Save rolling collector state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collector/data
          key: nowwhy-data-${{ github.run_id }}

